name: Validate Runtime Assets

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation dependency
        run: python -m pip install -r requirements-ci.txt

      - name: Validate immutable identity contracts
        run: python tools/validate_identity_contracts.py

      - name: Validate public runtime semantics
        run: python tools/validate_runtime_semantics.py

      - name: Require deterministic discovery output
        run: python tools/generate_discovery.py --check

      - name: Validate discovery consistency
        run: python tools/validate_discovery.py

      - name: Run contract regression tests
        run: python -m unittest discover -s tests -v
